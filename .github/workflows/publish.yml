name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check release version
        id: version
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { version } = require("./package.json");
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error("The Git tag must match v<package.json version>.");
          }
          const tag = version.includes("-") ? "next" : "latest";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check compiled package exports
        run: npm run check:exports

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
